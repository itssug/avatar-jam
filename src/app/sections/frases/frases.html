<section class="frases-section" #frasesSection>
  <!-- Section Divider estilo consola -->
  <div class="section-divider">
    <div class="divider-line"></div>
    <div class="divider-badge">
      <span class="divider-dot"></span>
      <span class="divider-text">CAPÍTULO II // LA VOZ DE LOS SIN VOZ</span>
      <span class="divider-dot"></span>
    </div>
    <div class="divider-line"></div>
  </div>

  <!-- Background effects -->
  <div class="frases-bg-noise"></div>
  <div class="frases-scanlines"></div>

  <!-- Sticky viewport container -->
  <div class="frases-sticky">

    <!-- Quote panels - cada uno independiente -->
    <div class="frase-panel" *ngFor="let frase of frases; let i = index">
      <div class="frase-content">
        <div class="frase-tag">
          <span class="frase-tag-dot"></span>
          {{ frase.tag }}
        </div>

        <div class="frase-number-wrapper">
          <span class="frase-number">{{ frase.id | number:'2.0' }}</span>
          <div class="frase-line-h"></div>
        </div>

        <h2 class="frase-quote">{{ frase.quote }}</h2>
        <p class="frase-subtitle">{{ frase.subtitle }}</p>

        <div class="frase-bottom-bar">
          <div class="signal-area">
            <span class="frase-signal-icon">◈</span>
            <span class="frase-signal-text">SEÑAL ACTIVA</span>
          </div>

          <button class="btn-medieval" [class.active]="activeAudioId === frase.id" (click)="toggleAudio(frase)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            {{ activeAudioId === frase.id ? 'DETENER' : 'ESCUCHAR ARCHIVO' }}
          </button>
        </div>

        <!-- Audio Progress (aparece solo cuando este audio está activo) -->
        <div class="audio-progress-wrapper" *ngIf="activeAudioId === frase.id">
          <span class="audio-time">{{ formatTime(audioCurrentTime) }}</span>
          <div class="progress-bar-bg">
            <div class="progress-fill" [style.width.%]="audioProgress"></div>
          </div>
          <span class="audio-time">{{ formatTime(audioDuration) }}</span>
        </div>
      </div>
    </div>

  </div>
</section>
