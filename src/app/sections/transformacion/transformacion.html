<section #transformSection class="transform-wrapper">

  <!-- BACKGROUNDS -->
  <div class="transform-bg"></div>
  <div class="transform-noise"></div>

  <!-- Sticky viewport container -->
  <div class="transform-sticky">

  <!-- ═══════════════════════════════════════════════════════
       PHASE 1 — EL HOMBRE
  ═══════════════════════════════════════════════════════ -->
  <div class="phase phase-1">

    <div class="frame frame--steel">
      <div class="frame__corner frame__corner--bl"></div>
      <div class="frame__corner frame__corner--br"></div>
    </div>

    <div class="phase-content">

      <div class="phase-tag phase-tag--steel">
        ARCHIVO HISTÓRICO · 1988
      </div>

      <h2 class="phase-title phase-title--man">
        JUAN CARLOS<br>PALENQUE
      </h2>

      <p class="phase-subtitle phase-subtitle--man">
        PERIODISTA · CONDUCTOR · LÍDER
      </p>

      <button class="btn-medieval" style="margin-top: 3rem;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="13 17 18 12 13 7"></polyline>
          <polyline points="6 17 11 12 6 7"></polyline>
        </svg>
        INICIAR TRANSMUTACIÓN
      </button>

    </div>

  </div>

  <!-- ═══════════════════════════════════════════════════════
       PHASE 2 — LA TRANSFORMACIÓN
  ═══════════════════════════════════════════════════════ -->
  <div class="phase phase-2">

    <div class="scan-lines"></div>

    <div class="phase-content">

      <div class="hud-container">
        <div class="hud-ring">
          <div class="hud-ring-inner">
            <div class="hud-ring-core"></div>
          </div>
        </div>
      </div>

      <h2 class="phase-title phase-title--transmutation glitch-text" data-text="TRANSMUTACIÓN">
        TRANSMUTACIÓN
      </h2>

      <p class="phase-subtitle phase-subtitle--freq">
        FRECUENCIA 3000 Hz DETECTADA
      </p>

      <div class="energy-particles"></div>

    </div>

  </div>

  <!-- ═══════════════════════════════════════════════════════
       PHASE 3 — EL HÉROE
  ═══════════════════════════════════════════════════════ -->
  <div class="phase phase-3">

    <div class="frame frame--bronze">
      <div class="frame__corner frame__corner--bl"></div>
      <div class="frame__corner frame__corner--br"></div>
    </div>

    <div class="phase-content">

      <div class="phase-tag phase-tag--cyan">
        TRANSMISIÓN ACTIVA · 2095
      </div>

      <h2 class="phase-title phase-title--hero">
        <span class="hero-name">EL COMPADRE</span><br>
        <span class="hero-number">3000</span>
      </h2>

      <p class="phase-subtitle phase-subtitle--hero">
        GUARDIÁN · PROTECTOR · VOZ DEL PUEBLO
      </p>

      <button class="btn-medieval" style="margin-top: 3rem;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="3" y1="9" x2="21" y2="9"></line>
          <line x1="9" y1="21" x2="9" y2="9"></line>
        </svg>
        VER ESTADÍSTICAS
      </button>

    </div>

  </div>

  </div> <!-- End sticky container -->
</section>
